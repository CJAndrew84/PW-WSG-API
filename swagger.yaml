    post:
      summary: Create Folder(s)
      deprecated: false
      description: ''
      tags:
        - '/v2.8/Repositories/{dataSourceAddress}/PW_WSG/Projects'
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                instance:
                  type: object
                  properties:
                    schemaName:
                      type: string
                    className:
                      type: string
                    instanceId:
                      type: string
                    changeState:
                      type: string
                    properties:
                      type: object
                      properties:
                        Name:
                          type: string
                        Description:
                          type: string
                      required:
                        - Name
                        - Description
                    relationshipInstances:
                      type: array
                      items:
                        type: object
                        properties:
                          schemaName:
                            type: string
                          className:
                            type: string
                          direction:
                            type: string
                          relatedInstance:
                            type: object
                            properties:
                              schemaName:
                                type: string
                              className:
                                type: string
                              instanceId:
                                type: string
                            required:
                              - schemaName
                              - className
                              - instanceId
                  required:
                    - schemaName
                    - className
                    - instanceId
                    - changeState
                    - properties
                    - relationshipInstances
              required:
                - instance
            example:
              instance:
                schemaName: PW_WSG
                className: Project
                instanceId: ''
                changeState: new
                properties:
                  Name: '{{folderName}}'
                  Description: ''
                relationshipInstances:
                  - schemaName: PW_WSG
                    className: ProjectParent
                    direction: forward
                    relatedInstance:
                      schemaName: PW_WSG
                      className: Project
                      instanceId: '{{newFolderId}}'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties: {}
          headers: {}
      security:
        - basic: []
